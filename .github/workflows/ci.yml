name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Run tests
        run: pytest -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit==1.7.10
      - name: Run Bandit
        shell: bash
        run: bandit -r app -ll | tee bandit-report.txt
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: bandit-report.txt

  docker:
    name: Build et push de l'image
    needs: [test, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tasks-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tasks-api:${{ github.sha }}


  deploy-dast:
    name: Deploy to kind and DAST (ZAP)
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/tasks-api tasks-api=${{ secrets.DOCKERHUB_USERNAME }}/tasks-api:${{ github.sha }}
          kubectl rollout status deployment/tasks-api --timeout=180s
      - name: Smoke test and DAST scan
        run: |
          kubectl port-forward svc/tasks-api 8000:80 > /dev/null 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID" EXIT
          sleep 5
          curl --fail http://localhost:8000/health
          mkdir -p zap && chmod 777 zap
          # host network: ZAP reaches the port-forward on the runner's localhost (Linux only)
          docker run --rm --network host -v "$(pwd)/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json -f openapi \
            -r zap-report.html -J zap-report.json -I
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: zap/

